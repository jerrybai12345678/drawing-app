<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>My Drawing App</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #app {
      display: flex;
      height: 100%;
    }
    #canvas-area {
      flex: 1;
      background: white;
      position: relative;
    }
    #canvas {
      display: block;
      touch-action: none;
    }
    #history-buttons {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 8px;
    }
    #history-buttons button {
      width: 48px;
      height: 48px;
      font-size: 24px;
      border: 1px solid #bbb;
      border-radius: 10px;
      background: #f2f2f2;
      cursor: pointer;
    }
    #history-buttons button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    #sidebar {
      width: 250px;
      background: #e0e0e0;
      padding: 16px;
      box-sizing: border-box;
      border-left: 1px solid #bbb;
    }
    .tool-label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }
    #color-picker {
      width: 100%;
      height: 50px;
      border: none;
      padding: 0;
      cursor: pointer;
      background: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="canvas-area">
      <canvas id="canvas"></canvas>
      <div id="history-buttons">
        <button id="undo-btn" aria-label="Undo">↩</button>
        <button id="redo-btn" aria-label="Redo">↪</button>
      </div>
    </div>
    <div id="sidebar">
      <label class="tool-label" for="color-picker">Color</label>
      <input type="color" id="color-picker" value="#000000">

      <p>Brush size and eraser will go here.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const area = document.getElementById("canvas-area");
    const ctx = canvas.getContext("2d");
    const colorPicker = document.getElementById("color-picker");
    const undoBtn = document.getElementById("undo-btn");
    const redoBtn = document.getElementById("redo-btn");

    // Make the canvas fill its area
    canvas.width = area.clientWidth;
    canvas.height = area.clientHeight;

    // ----- Undo / redo history -----
    const MAX_HISTORY = 30;
    let undoStack = [];
    let redoStack = [];

    function snapshot() {
      return ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function updateButtons() {
      undoBtn.disabled = undoStack.length <= 1;
      redoBtn.disabled = redoStack.length === 0;
    }

    function saveState() {
      undoStack.push(snapshot());
      if (undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
      updateButtons();
    }

    function undo() {
      if (undoStack.length <= 1) return;
      redoStack.push(undoStack.pop());
      ctx.putImageData(undoStack[undoStack.length - 1], 0, 0);
      updateButtons();
    }

    function redo() {
      if (redoStack.length === 0) return;
      const state = redoStack.pop();
      undoStack.push(state);
      ctx.putImageData(state, 0, 0);
      updateButtons();
    }

    undoBtn.addEventListener("click", undo);
    redoBtn.addEventListener("click", redo);

    // Save the blank canvas as the starting point
    saveState();

    // ----- Drawing -----
    let drawing = false;

    function endStroke() {
      if (!drawing) return;
      drawing = false;
      saveState();
    }

    canvas.addEventListener("pointerdown", (e) => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });
    canvas.addEventListener("pointerup", endStroke);
    canvas.addEventListener("pointerleave", endStroke);
    canvas.addEventListener("pointercancel", endStroke);
    canvas.addEventListener("pointermove", (e) => {
      if (!drawing) return;
      ctx.strokeStyle = colorPicker.value;
      ctx.lineWidth = e.pressure * 10 || 5;
      ctx.lineCap = "round";
      ctx.lineTo(e.offsetX, e.offsetY);
      ctx.stroke();
    });
  </script>
</body>
</html>
