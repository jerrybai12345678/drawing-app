<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>My Drawing App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="canvas-area">
      <canvas id="canvas"></canvas>
      <div id="history-buttons">
        <button id="undo-btn" aria-label="Undo">↩</button>
        <button id="redo-btn" aria-label="Redo">↪</button>
      </div>
    </div>
    <div id="sidebar">
      <label class="tool-label" for="color-picker">Color</label>
      <input type="color" id="color-picker" value="#000000">

      <label class="tool-label" for="size-slider">
        Brush size: <span id="size-value">10</span>
      </label>
      <input type="range" id="size-slider" min="1" max="100" value="10">

      <div id="tool-buttons">
        <button id="brush-btn" class="active">Brush</button>
        <button id="eraser-btn">Eraser</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
